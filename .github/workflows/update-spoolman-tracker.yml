name: Update Spoolman Tracker Add-on

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Upstream spoolman-tracker version to use. Leave empty to auto-detect the latest release.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve target version
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const manual = `${{ inputs.version || '' }}`.trim();
            if (manual) {
              core.setOutput('version', manual.replace(/^v/, ''));
              return;
            }

            const latest = await github.rest.repos.getLatestRelease({
              owner: 'nozzle-1',
              repo: 'spoolman-tracker',
            });

            core.setOutput('version', latest.data.tag_name.replace(/^v/, ''));

      - name: Update add-on files
        id: bump
        env:
          TARGET_VERSION: ${{ steps.resolve.outputs.version }}
        run: node .github/scripts/update-spoolman-tracker.mjs

      - name: Create pull request
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(spoolman-tracker): bump to ${{ steps.bump.outputs.target_version }}"
          branch: "automation/spoolman-tracker-v${{ steps.bump.outputs.target_version }}"
          delete-branch: true
          title: "chore(spoolman-tracker): bump to ${{ steps.bump.outputs.target_version }}"
          body: |
            Automated update for the Spoolman Tracker Home Assistant add-on.

            Changes:
            - bump upstream image to `ghcr.io/nozzle-1/spoolman-tracker:${{ steps.bump.outputs.target_version }}`
            - set add-on version to `${{ steps.bump.outputs.next_addon_version }}`

            Source release: https://github.com/nozzle-1/spoolman-tracker/releases/tag/v${{ steps.bump.outputs.target_version }}
